<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이문아이파크자이 3단지 입대의 액션리스트 v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1d1d1b;--sub:#6b6a66;--line:#e4e2dc;--accent:#1f4e79;--hi:#c0392b;--mid:#b9770e;--lo:#7f8c8d;--ok:#2e7d4f;--wait:#8e44ad;}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#21211f;--ink:#ecebe7;--sub:#a3a29d;--line:#34332f;--accent:#7fb2e5;}}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
header{padding:18px 16px 8px;max-width:980px;margin:0 auto}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hrow>div{min-width:0}
button.xbtn{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:none;background:#1d6f42;color:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap}
button.xbtn:hover{background:#185c37}
@media (max-width:520px){button.xbtn{padding:8px 11px;font-size:13px}}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--sub);font-size:13px}
main{max-width:980px;margin:0 auto;padding:0 12px 90px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--sub)}
.kpi.on{outline:2px solid var(--accent)}
.tabs{display:flex;gap:6px;margin:8px 0}
.tab{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);border-radius:10px;font:inherit;color:var(--ink);cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.bar input,.bar select{flex:1;min-width:120px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group-h{margin:18px 4px 6px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.group-h small{color:var(--sub);font-weight:400}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--lo);border-radius:12px;margin:8px 0;overflow:hidden}
.item.p-높음{border-left-color:var(--hi)}.item.p-보통{border-left-color:var(--mid)}
.item.s-완료{opacity:.6}
.ihead{padding:11px 12px;cursor:pointer}
.ititle{font-weight:700;display:flex;gap:6px;align-items:flex-start}
.no{color:var(--sub);font-weight:500;min-width:28px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:12px}
.tag{padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--sub)}
.st{font-weight:700;color:#fff;border:none}
.st-미착수{background:#95a5a6}.st-진행중{background:#2874a6}.st-회신대기{background:var(--wait)}.st-완료{background:var(--ok)}.st-보류{background:#566573}
.letter{color:var(--hi);border-color:var(--hi)}
.agtag{color:var(--accent);border-color:var(--accent);font-weight:700}
.agbox{background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:12px;margin:10px 0}
.agbox.urgent{border-color:#c0392b}
.agbox.urgent h3{color:#c0392b}
.agbox h3{margin:0 0 4px;font-size:16px}
.agline{padding:8px 0;border-top:1px dashed var(--line)}
.agline:first-of-type{border-top:none}
.agline b{display:block}
.agline span{font-size:13px;color:var(--sub)}
.likebar{padding:0 12px 10px;display:flex;gap:6px;align-items:center}
.like{font-size:13px;padding:5px 10px!important}
.like.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ost0{background:#95a5a6}.ost1{background:#2874a6}.ost2{background:#2e7d4f}.ost3{background:#b9770e}.ost4{background:#1e8449}.ost5{background:#7b7d7d}
.intro{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.intro p{margin:4px 0;font-size:14px}
.adm{margin-top:10px;padding:10px;border-radius:8px;background:var(--bg);display:grid;gap:6px}
.adm textarea,.adm input,.adm select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.admbar{display:flex;gap:8px;justify-content:center;margin-top:10px;font-size:13px}
.ibody{display:none;padding:0 12px 12px;border-top:1px dashed var(--line)}
.item.open .ibody{display:block}
.row{margin-top:10px}
.row h4{margin:0 0 3px;font-size:12px;color:var(--sub);font-weight:500}
.row p{margin:0;white-space:pre-wrap}
.row.quick p{background:rgba(46,125,79,.1);padding:8px;border-radius:8px}
.row.resolve p{background:rgba(31,78,121,.09);padding:8px;border-radius:8px}
.acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.acts select{padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
button.b{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{color:var(--hi);border-color:var(--hi)}
.fab{position:fixed;right:16px;bottom:18px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:13px 18px;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.note{padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--sub);margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.sheet h3{margin:0 0 10px}
.sheet label{display:block;font-size:12px;color:var(--sub);margin:10px 0 3px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.sheet textarea{min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
.empty{text-align:center;color:var(--sub);padding:30px}
#copyArea{width:100%;min-height:300px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(5,1fr);gap:5px}.kpi b{font-size:18px}.kpi span{font-size:11px}}
</style>
</head>
<body>
<header>
  <div class="hrow">
  <div>
    <h1>이문아이파크자이 3단지 입대의 액션리스트 <small style="font-size:12px;color:var(--sub)">v2</small></h1>
    <div class="sub">입대의 액션리스트 · 💬 입주민 누구나 의견 등록·공감 가능 <span id="sync"></span></div>
  </div>
  <button class="xbtn" id="xlsxBtn" title="현재 목록을 엑셀 파일로 받기">📥 엑셀 다운로드</button>
  </div>
</header>
<main>
  <div class="kpis" id="kpis"></div>
  <div class="tabs">
    <button class="tab on" data-v="list">항목별</button>
    <button class="tab" data-v="agenda" id="agTab">📌 다음 안건</button>
    <button class="tab" data-v="opinions" id="opTab">💬 입주민 의견</button>
    <button class="tab" data-v="contact">연락처별</button>
    <button class="tab" data-v="owner">담당자별</button>
  </div>
  <div class="bar">
    <input id="q" placeholder="검색 (예: 조합, CCTV, 307동)">
    <select id="pf"><option value="">우선순위 전체</option><option>높음</option><option>보통</option><option>낮음</option></select>
    <select id="lf"><option value="">공문 전체</option><option value="y">공문 필요만</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div id="msg"></div>
  <div id="out"></div>
  <div class="acts" style="margin-top:20px"><button class="b" id="copyBtn">텍스트 복사</button><button class="b" id="pinBtn">🔑 입대의 편집 모드</button></div>
</main>
<button class="fab" id="addBtn">＋ 항목 추가</button>

<div class="modal" id="edit"><div class="sheet">
  <h3 id="eTitle">항목 추가</h3>
  <form id="eform">
    <label>제목 *</label><input name="title" required>
    <div class="two">
      <div><label>분류</label><select name="cat" id="catSel"></select></div>
      <div><label>우선순위</label><select name="priority"><option>높음</option><option selected>보통</option><option>낮음</option></select></div>
    </div>
    <div class="two">
      <div><label>상태</label><select name="status"><option>미착수</option><option>진행중</option><option>회신대기</option><option>완료</option><option>보류</option></select></div>
      <div><label>기한</label><input name="due" placeholder="예: 11/30"></div>
    </div>
    <label>연락처 (쉼표로 구분)</label><input name="contacts" placeholder="관리사무소, 조합, HDC현산">
    <div class="two">
      <div><label>담당</label><input name="owner" placeholder="예: 총무이사 / 홍길동"></div>
      <div><label>제안자</label><input name="proposer"></div>
    </div>
    <label><input type="checkbox" name="letter" style="width:auto"> 공문 발송 필요</label>
    <label><input type="checkbox" name="agenda" style="width:auto"> 📌 다음 회의 안건으로 추천</label>
    <label>안건 회의 구분</label><select name="meeting"><option value="정기">📌 정기회의</option><option value="임시">⚡ 임시회의 (긴급)</option></select>
    <label>바로 할 수 있는 것</label><textarea name="quick"></textarea>
    <label>해결하려면 (해결 조건·절차)</label><textarea name="resolve"></textarea>
    <label>배경·원문 / 진행 메모</label><textarea name="note"></textarea>
    <label>입대의 편집 비밀번호 *</label><input name="pin" type="password" autocomplete="current-password" placeholder="입대의에서 공유한 비밀번호">
    <div class="foot">
      <button type="button" class="b danger" id="delBtn">삭제</button>
      <div style="display:flex;gap:8px"><button type="button" class="b" id="cancelBtn">취소</button><button class="b pri">저장</button></div>
    </div>
  </form>
</div></div>

<div class="modal" id="opM"><div class="sheet">
  <h3>💬 의견 내기</h3>
  <div class="sub">단지 개선 제안을 남겨주세요. 이름·호수·연락처는 적지 마세요. 하자·고장 민원은 <span id="vocHint">관리사무소</span>로 접수해 주세요.</div>
  <form id="opForm">
    <label>분류</label><select name="cat" id="opCat"></select>
    <label>제목 *</label><input name="title" maxlength="80" required placeholder="한 줄로 요약">
    <label>내용 *</label><textarea name="body" maxlength="1500" required placeholder="무엇이 문제이고, 어떻게 바뀌면 좋을지"></textarea>
    <div class="two">
      <div><label>동 (선택)</label><input name="dong" maxlength="10" placeholder="예: 305동"></div>
      <div><label>관련 액션 번호 (선택)</label><input name="relNo" maxlength="10" placeholder="예: 14"></div>
    </div>
    <div class="foot"><span></span><div style="display:flex;gap:8px"><button type="button" class="b" id="opCancel">취소</button><button class="b pri">등록</button></div></div>
  </form>
</div></div>

<div class="modal" id="pinM"><div class="sheet">
  <h3>🔑 입대의 편집 모드</h3>
  <div class="sub">입대의 편집 비밀번호를 넣으면 항목 추가·수정과 의견 답변을 할 수 있어요. 이 기기에만 기억됩니다.</div>
  <label>편집 비밀번호</label><input id="pinIn" type="password" autocomplete="current-password">
  <div class="foot"><button type="button" class="b danger" id="pinOff">편집 모드 끄기</button><div style="display:flex;gap:8px"><button type="button" class="b" id="pinCancel">취소</button><button type="button" class="b pri" id="pinOk">확인</button></div></div>
</div></div>

<div class="modal" id="copyM"><div class="sheet">
  <h3>회의록용 텍스트</h3>
  <div class="sub" id="copyHint">아래 내용을 길게 눌러 복사하세요.</div>
  <textarea id="copyArea" readonly></textarea>
  <div class="foot"><span></span><button class="b" id="copyClose">닫기</button></div>
</div></div>

<script>
const API="https://script.google.com/macros/s/AKfycbwZ0ceSkvK3RrCOUdrbGldnEnzP5dy3OQiWlWnuGr8QBusPNnm66nyS7aPnsV18KCT8/exec"; // 구글 Apps Script 웹 앱 URL
const VOC_URL=""; // VOC 등록소 주소 (있으면)
const LIKE_TH=10; // 공감 이 수 이상이면 안건 후보
const OST=["접수","검토중","액션리스트 등록","안건 상정","반영 완료","반영 불가"];
const CATS=["입대의 운영·계약","용역관리(청소·경비)","커뮤니티센터","주차·출입","보안시설(CCTV·도어)","조경·외부공간","하자·누수","대외 민원·협의"];
const STATUS=["미착수","진행중","회신대기","완료","보류"];
const PR={"높음":0,"보통":1,"낮음":2};
let items=[],opinions=[],db=null,canWrite=true,view="list",catF="",stF="",editingId=null,delArm=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arr=v=>Array.isArray(v)?v:String(v||"").split(",").map(x=>x.trim()).filter(Boolean);

$("#catSel").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");

function filtered(){
  const q=$("#q").value.trim().toLowerCase(),pf=$("#pf").value,lf=$("#lf").value;
  return items.filter(it=>{
    if(catF&&it.cat!==catF)return false;
    if(stF&&it.status!==stF)return false;
    if(pf&&it.priority!==pf)return false;
    if(lf&&!it.letter)return false;
    if(q){const hay=[it.title,it.cat,arr(it.contacts).join(" "),it.owner,it.proposer,it.quick,it.resolve,it.note,"#"+it.no].join(" ").toLowerCase();if(!hay.includes(q))return false;}
    return true;
  }).sort((a,b)=>(a.status==="완료")-(b.status==="완료")||(PR[a.priority]??1)-(PR[b.priority]??1)||(a.no||0)-(b.no||0));
}

function kpis(){
  const n=s=>items.filter(i=>i.status===s).length;
  const defs=[["","전체",items.length],["미착수","미착수",n("미착수")],["진행중","진행중",n("진행중")],["회신대기","회신대기",n("회신대기")],["완료","완료",n("완료")]];
  $("#kpis").innerHTML=defs.map(([k,l,v])=>`<div class="kpi ${stF===k?"on":""}" data-s="${k}"><b>${v}</b><span>${l}</span></div>`).join("");
  $("#kpis").querySelectorAll(".kpi").forEach(e=>e.onclick=()=>{stF=e.dataset.s;render();});
  const cats=[...new Set([...CATS,...items.map(i=>i.cat).filter(Boolean)])];
  $("#chips").innerHTML=[`<button class="chip ${catF?"":"on"}" data-c="">전체</button>`,...cats.map(c=>`<button class="chip ${catF===c?"on":""}" data-c="${esc(c)}">${esc(c)} ${items.filter(i=>i.cat===c&&i.status!=="완료").length}</button>`)].join("");
  $("#chips").querySelectorAll(".chip").forEach(e=>e.onclick=()=>{catF=e.dataset.c;render();});
}

function card(it){
  const cs=arr(it.contacts);
  return `<div class="item p-${esc(it.priority)} s-${esc(it.status)}" data-id="${esc(it._id)}">
  <div class="ihead"><div class="ititle"><span class="no">#${esc(it.no)}</span><span>${esc(it.title)}</span></div>
  <div class="meta"><span class="tag st st-${esc(it.status)}">${esc(it.status)}</span><span class="tag">${esc(it.priority)}</span>
  ${it.owner?`<span class="tag">👤 ${esc(it.owner)}</span>`:""}${cs.length?`<span class="tag">📞 ${esc(cs.join(", "))}</span>`:""}
  ${it.agenda&&it.status!=="완료"?`<span class="tag agtag">${mt(it)==="임시"?"⚡ 임시회의 안건":"📌 정기회의 안건"}</span>`:""}${it.letter?`<span class="tag letter">공문</span>`:""}${it.due?`<span class="tag">⏰ ${esc(it.due)}</span>`:""}</div></div>
  <div class="ibody">
   <div class="row"><h4>분류 · 제안</h4><p>${esc(it.cat)}${it.proposer?" · 제안: "+esc(it.proposer):""}</p></div>
   ${it.quick?`<div class="row quick"><h4>✅ 바로 할 수 있는 것</h4><p>${esc(it.quick)}</p></div>`:""}
   ${it.resolve?`<div class="row resolve"><h4>🔧 해결하려면</h4><p>${esc(it.resolve)}</p></div>`:""}
   ${it.note?`<div class="row"><h4>배경·메모</h4><p>${esc(it.note)}</p></div>`:""}
   ${canWrite&&isAdmin()?`<div class="acts"><select class="stSel">${STATUS.map(s=>`<option ${s===it.status?"selected":""}>${s}</option>`).join("")}</select><button class="b editBtn">편집</button></div>`:""}
  </div></div>`;
}

function agOrd(i){const m=String(i.title||"").match(/^\[안건\s*(\d+)\]/);return +i.agendaOrder||(m?+m[1]:99);}
function mt(i){return i.meeting==="임시"?"임시":"정기";}
const MEET={"임시":{icon:"⚡",name:"임시회의",sub:"정기회의를 기다릴 수 없는 긴급 안건입니다. 회의 날짜는 기한(⏰)에 적어주세요."},"정기":{icon:"📌",name:"정기회의",sub:"입대의 의결·결정이 필요한 항목입니다. 회의 후 처리된 항목은 체크를 해제하거나 상태를 바꿔주세요."}};
function agBox(ag,k){if(!ag.length)return "";const M=MEET[k];return `<div class="agbox${k==="임시"?" urgent":""}"><h3>${M.icon} 다음 ${M.name} 안건 (${ag.length}건)</h3><div class="sub">${M.sub}</div>${ag.map((i,n)=>`<div class="agline"><b>${n+1}. ${esc(i.title)} <small style="color:var(--sub)">#${esc(i.no)}</small></b><span>${i.due?`⏰ ${esc(i.due)} · `:""}결정할 것: ${esc(i.resolve||"-")}</span></div>`).join("")}</div>`;}
function agText(ag,k){if(!ag.length)return "";const M=MEET[k];let t=`\n${M.icon} [${M.name} 안건]\n`;ag.forEach((i,n)=>{t+=`\n${n+1}. ${i.title}${i.due?` (⏰ ${i.due})`:""}\n - 결정할 것: ${(i.resolve||"-").replace(/\n/g," ")}\n - 담당: ${i.owner||"미정"} / 제안: ${i.proposer||"-"}\n`;});return t;}
function render(){
  kpis();updateChrome();
  if(view==="opinions"){renderOpinions();return;}
  const list=filtered(),out=$("#out");
  if(!items.length){out.innerHTML=`<div class="empty">아직 항목이 없습니다.</div>`;return;}
  if(!list.length){out.innerHTML=`<div class="empty">조건에 맞는 항목이 없습니다.</div>`;return;}
  const agN=items.filter(i=>i.agenda&&i.status!=="완료").length;
  $("#agTab").textContent=`📌 다음 안건 ${agN}`;
  let groups=[],head="";
  if(view==="agenda"){
    const ag=list.filter(i=>i.agenda&&i.status!=="완료").sort((a,b)=>agOrd(a)-agOrd(b)||(a.no||0)-(b.no||0));
    if(!ag.length&&!opCand().length){out.innerHTML=`<div class="empty">추천된 안건이 없습니다. 항목 편집에서 '다음 회의 안건으로 추천'을 체크하고 정기·임시를 고르세요.</div>`;return;}
    head=(ag.length?agBox(ag.filter(i=>mt(i)==="임시"),"임시")+agBox(ag.filter(i=>mt(i)==="정기"),"정기"):"")+opCandBox();
    const m={};ag.forEach(i=>(m[i.cat||"기타"]??=[]).push(i));
    groups=[...CATS,...Object.keys(m).filter(k=>!CATS.includes(k))].filter(k=>m[k]).map(k=>[k,m[k]]);
  }else if(view==="list"){
    const m={};list.forEach(i=>(m[i.cat||"기타"]??=[]).push(i));
    groups=[...CATS,...Object.keys(m).filter(k=>!CATS.includes(k))].filter(k=>m[k]).map(k=>[k,m[k]]);
  }else{
    const m={};
    list.forEach(i=>{const keys=view==="contact"?arr(i.contacts):arr((i.owner||"미지정").replace(/\//g,","));(keys.length?keys:["미지정"]).forEach(k=>(m[k]??=[]).push(i));});
    groups=Object.entries(m).sort((a,b)=>b[1].length-a[1].length);
  }
  out.innerHTML=head+groups.map(([k,v])=>`<div class="group-h">${view==="contact"?"📞 ":view==="owner"?"👤 ":""}${esc(k)} <small>${v.filter(i=>i.status!=="완료").length}건 진행 필요</small></div>${v.map(card).join("")}`).join("");
  out.querySelectorAll(".item").forEach(el=>{
    const id=el.dataset.id;
    el.querySelector(".ihead").onclick=()=>el.classList.toggle("open");
    const s=el.querySelector(".stSel");if(s)s.onchange=()=>saveField(id,{status:s.value});
    const e=el.querySelector(".editBtn");if(e)e.onclick=()=>openEdit(id);
  });
}

async function api(body){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"저장 실패");return j;
}
function getPin(){try{return localStorage.getItem("ipdae_pin")||"";}catch(e){return "";}}
function setPin(p){try{localStorage.setItem("ipdae_pin",p);}catch(e){}}
async function saveField(id,patch){
  if(!API)return;
  let pin=getPin();
  if(!pin){openEdit(id);flash("상태를 바꾸려면 편집 화면에서 비밀번호를 한 번 입력하세요.");return;}
  const it=items.find(i=>i._id===id);const old={...it};Object.assign(it,patch);render();
  try{await api({action:"update",pin,id,item:patch});flash("");}
  catch(e){Object.assign(it,old);render();flash("저장하지 못했습니다: "+e.message);if(/비밀번호/.test(e.message))setPin("");}
}

function flash(t){$("#msg").innerHTML=t?`<div class="note">${esc(t)}</div>`:"";}

function openEdit(id){
  editingId=id;delArm=false;$("#delBtn").textContent="삭제";
  const f=$("#eform"),it=id?items.find(i=>i._id===id):{cat:catF||CATS[0],priority:"보통",status:"미착수"};
  $("#eTitle").textContent=id?`#${it.no} 편집`:"항목 추가";
  $("#delBtn").style.visibility=id?"visible":"hidden";
  ["title","cat","priority","status","due","owner","proposer","quick","resolve","note"].forEach(k=>f.elements[k].value=it[k]||"");
  if(it.cat&&!CATS.includes(it.cat))f.elements.cat.insertAdjacentHTML("beforeend",`<option>${esc(it.cat)}</option>`),f.elements.cat.value=it.cat;
  f.elements.contacts.value=arr(it.contacts).join(", ");
  f.elements.letter.checked=!!it.letter;f.elements.agenda.checked=!!it.agenda;f.elements.meeting.value=mt(it);f.elements.pin.value=getPin();
  $("#edit").classList.add("on");
}
$("#cancelBtn").onclick=()=>$("#edit").classList.remove("on");
$("#addBtn").onclick=()=>(view==="opinions"||!isAdmin())?openOp():openEdit(null);
$("#eform").onsubmit=async ev=>{
  ev.preventDefault();if(!API){flash("저장소가 아직 연결되지 않았습니다.");return;}
  const f=ev.target,pin=f.elements.pin.value.trim();
  if(!pin){flash("편집 비밀번호를 입력하세요.");f.elements.pin.focus();return;}
  const data={title:f.elements.title.value.trim(),cat:f.elements.cat.value,priority:f.elements.priority.value,status:f.elements.status.value,due:f.elements.due.value.trim(),
    contacts:arr(f.elements.contacts.value),owner:f.elements.owner.value.trim(),proposer:f.elements.proposer.value.trim(),letter:f.elements.letter.checked,agenda:f.elements.agenda.checked,meeting:f.elements.meeting.value,
    quick:f.elements.quick.value.trim(),resolve:f.elements.resolve.value.trim(),note:f.elements.note.value.trim()};
  const btn=f.querySelector("button.pri");btn.disabled=true;btn.textContent="저장 중…";
  try{
    if(editingId)await api({action:"update",pin,id:editingId,item:data});

$("#delBtn").onclick=async()=>{
  if(!delArm){delArm=true;$("#delBtn").textContent="한 번 더 누르면 삭제";return;}
  const pin=$("#eform").elements.pin.value.trim()||getPin();
  if(!pin){flash("편집 비밀번호를 입력하세요.");return;}
  try{await api({action:"delete",pin,id:editingId});setPin(pin);$("#edit").classList.remove("on");await load();}catch(e){flash("삭제하지 못했습니다: "+e.message);}
};

function isAdmin(){return !!getPin();}
function cid(){try{let c=localStorage.getItem("ipdae_cid");if(!c){c=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("ipdae_cid",c);}return c;}catch(e){return "";}}
function likedSet(){try{return new Set(JSON.parse(localStorage.getItem("ipdae_liked")||"[]"));}catch(e){return new Set();}}
function saveLiked(st){try{localStorage.setItem("ipdae_liked",JSON.stringify([...st]));}catch(e){}}
function updateChrome(){
  const openN=opinions.filter(o=>o.status==="접수"||o.status==="검토중").length;
  $("#opTab").textContent=`💬 입주민 의견${openN?" "+openN:""}`;
  const fab=$("#addBtn");
  if(!API){fab.style.display="none";}else{fab.style.display="";fab.textContent=(view==="opinions"||!isAdmin())?"💬 의견 내기":"＋ 항목 추가";}
  $("#pinBtn").textContent=isAdmin()?"🔑 편집 모드 켜짐":"🔑 입대의 편집 모드";
}
function opCand(){return opinions.filter(o=>(o.likes||0)>=LIKE_TH&&(o.status==="접수"||o.status==="검토중")).sort((a,b)=>b.likes-a.likes);}
function opCandBox(){
  const c=opCand();if(!c.length)return "";
  return `<div class="agbox"><h3>👍 입주민 공감 의견 (공감 ${LIKE_TH}개 이상 · ${c.length}건)</h3><div class="sub">입주민 공감이 많아 안건 후보로 올라온 의견입니다.</div>${c.map(o=>`<div class="agline"><b>💬${esc(o.no)} ${esc(o.title)} · 👍${o.likes}</b><span>${esc(String(o.body).slice(0,90))}</span></div>`).join("")}</div>`;
}
function opList(){
  const q=$("#q").value.trim().toLowerCase();
  const rank=o=>["접수","검토중"].includes(o.status)?0:["액션리스트 등록","안건 상정"].includes(o.status)?1:2;
  return opinions.filter(o=>(!catF||o.cat===catF)&&(!q||[o.title,o.body,o.cat,o.dong,o.reply,"💬"+o.no].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>rank(a)-rank(b)||(b.likes||0)-(a.likes||0)||b.no-a.no);
}
function opCard(o){
  const liked=likedSet().has(o._id),si=Math.max(0,OST.indexOf(o.status));
  const dt=o.createdAt?new Date(o.createdAt):null;
  return `<div class="item" data-oid="${esc(o._id)}">
  <div class="ihead"><div class="ititle"><span class="no">💬${esc(o.no)}</span><span>${esc(o.title)}</span></div>
  <div class="meta"><span class="tag st ost${si}">${esc(o.status)}</span>${o.cat?`<span class="tag">${esc(o.cat)}</span>`:""}${o.dong?`<span class="tag">${esc(o.dong)}</span>`:""}${o.source&&o.source!=="웹"?`<span class="tag">${esc(o.source)}</span>`:""}${o.linkedNo?`<span class="tag agtag">→ 액션 #${esc(o.linkedNo)}</span>`:""}${o.reply?`<span class="tag">답변 있음</span>`:""}${dt&&!isNaN(dt)?`<span class="tag">${dt.getMonth()+1}/${dt.getDate()}</span>`:""}</div></div>
  <div class="ibody">
   <div class="row"><p>${esc(o.body)}</p></div>
   ${o.relNo?`<div class="row"><h4>관련 액션</h4><p>#${esc(o.relNo)}</p></div>`:""}
   ${o.reply?`<div class="row resolve"><h4>입대의 답변</h4><p>${esc(o.reply)}</p></div>`:""}
   ${isAdmin()?`<div class="adm"><select class="oSt">${OST.map(x=>`<option ${x===o.status?"selected":""}>${x}</option>`).join("")}</select>
     <textarea class="oRe" placeholder="입대의 답변 (입주민에게 공개)">${esc(o.reply||"")}</textarea>
     <input class="oLn" placeholder="연결된 액션 번호" value="${esc(o.linkedNo||"")}">
     <div class="acts" style="margin-top:0"><button class="b pri oSave">저장</button>${o.linkedNo?"":`<button class="b oPro">액션리스트로 등록</button>`}<button class="b danger oDel">삭제</button></div></div>`:""}
  </div>
  <div class="likebar"><button class="b like ${liked?"on":""}">👍 공감 ${o.likes||0}</button></div></div>`;
}
function renderOpinions(){
  const out=$("#out");
  const intro=`<div class="intro"><b>💬 입주민 의견함</b><p>단지 개선 제안을 자유롭게 남겨주세요. 입대의가 검토해서 답변하고, 필요하면 액션리스트에 올립니다.</p><p>👍 공감이 ${LIKE_TH}개 이상 모이면 다음 입대의 안건 후보로 올라갑니다.</p>${VOC_URL?`<p>하자·고장 민원은 <a href="${esc(VOC_URL)}">VOC 등록소</a>로 접수해 주세요.</p>`:`<p>하자·고장 민원은 관리사무소로 접수해 주세요.</p>`}${API?`<button class="b pri" id="opNew">💬 의견 내기</button>`:`<p class="sub">의견함은 저장소 연결 후 열립니다.</p>`}</div>`;
  const list=opList();
  out.innerHTML=intro+(list.length?list.map(opCard).join(""):`<div class="empty">아직 등록된 의견이 없습니다.</div>`);
  const nb=$("#opNew");if(nb)nb.onclick=openOp;
  out.querySelectorAll("[data-oid]").forEach(el=>{
    const id=el.dataset.oid,o=opinions.find(x=>x._id===id);
    el.querySelector(".ihead").onclick=()=>el.classList.toggle("open");
    el.querySelector(".like").onclick=async ev=>{
      ev.stopPropagation();if(!API)return;
      const st=likedSet(),was=st.has(id);
      was?st.delete(id):st.add(id);saveLiked(st);o.likes=(o.likes||0)+(was?-1:1);renderOpinions();
      try{const j=await api({action:"opinion_like",id,cid:cid()});o.likes=j.likes;j.liked?st.add(id):st.delete(id);saveLiked(st);renderOpinions();}
      catch(e){flash("공감을 저장하지 못했습니다: "+e.message);}
    };
    if(!isAdmin())return;
    const pin=getPin();
    const sv=el.querySelector(".oSave");if(sv)sv.onclick=async()=>{
      try{await api({action:"opinion_update",pin,id,item:{status:el.querySelector(".oSt").value,reply:el.querySelector(".oRe").value.trim(),linkedNo:el.querySelector(".oLn").value.trim()}});flash("저장했습니다.");await load();}
      catch(e){flash("저장하지 못했습니다: "+e.message);if(/비밀번호/.test(e.message))setPin("");}
    };
    const pr=el.querySelector(".oPro");if(pr)pr.onclick=async()=>{
      try{const j=await api({action:"opinion_promote",pin,id});flash(`액션리스트 #${j.no}로 등록했습니다. 항목별 탭에서 담당·연락처를 채워주세요.`);await load();}
      catch(e){flash("등록하지 못했습니다: "+e.message);}
    };
    const dl=el.querySelector(".oDel");let arm=false;if(dl)dl.onclick=async()=>{
      if(!arm){arm=true;dl.textContent="한 번 더 누르면 삭제";return;}
      try{await api({action:"opinion_delete",pin,id});await load();}catch(e){flash("삭제하지 못했습니다: "+e.message);}
    };
  });
}

function xlsxRows(){return items.slice().sort((a,b)=>(a.no||0)-(b.no||0)).map(i=>({"번호":i.no,"분류":i.cat,"제목":i.title,"상태":i.status,"우선순위":i.priority,"담당":i.owner||"","연락처":arr(i.contacts).join(", "),"공문":i.letter?"Y":"","다음안건":i.agenda?"Y":"","회의구분":i.agenda?mt(i)+"회의":"","기한":i.due||"","바로 할 것":i.quick||"","해결하려면":i.resolve||"","제안":i.proposer||"","메모":i.note||""}));}
async function downloadXlsx(){
  const rows=xlsxRows();if(!rows.length)return;

    XLSX.writeFile(wb,fn+".xlsx");
  }catch(e){
    const keys=Object.keys(rows[0]),q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const csv="﻿"+[keys.map(q).join(","),...rows.map(r=>keys.map(k=>q(r[k])).join(","))].join("\r\n");

}
