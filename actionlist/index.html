<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이문아이파크자이 3단지 입대의 액션리스트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1d1d1b;--sub:#6b6a66;--line:#e4e2dc;--accent:#1f4e79;--hi:#c0392b;--mid:#b9770e;--lo:#7f8c8d;--ok:#2e7d4f;--wait:#8e44ad;}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#21211f;--ink:#ecebe7;--sub:#a3a29d;--line:#34332f;--accent:#7fb2e5;}}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
header{padding:18px 16px 8px;max-width:980px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--sub);font-size:13px}
main{max-width:980px;margin:0 auto;padding:0 12px 90px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--sub)}
.kpi.on{outline:2px solid var(--accent)}
.tabs{display:flex;gap:6px;margin:8px 0}
.tab{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);border-radius:10px;font:inherit;color:var(--ink);cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.bar input,.bar select{flex:1;min-width:120px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group-h{margin:18px 4px 6px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.group-h small{color:var(--sub);font-weight:400}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--lo);border-radius:12px;margin:8px 0;overflow:hidden}
.item.p-높음{border-left-color:var(--hi)}.item.p-보통{border-left-color:var(--mid)}
.item.s-완료{opacity:.6}
.ihead{padding:11px 12px;cursor:pointer}
.ititle{font-weight:700;display:flex;gap:6px;align-items:flex-start}
.no{color:var(--sub);font-weight:500;min-width:28px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:12px}
.tag{padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--sub)}
.st{font-weight:700;color:#fff;border:none}
.st-미착수{background:#95a5a6}.st-진행중{background:#2874a6}.st-회신대기{background:var(--wait)}.st-완료{background:var(--ok)}.st-보류{background:#566573}
.letter{color:var(--hi);border-color:var(--hi)}
.agtag{color:var(--accent);border-color:var(--accent);font-weight:700}
.agbox{background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:12px;margin:10px 0}
.agbox h3{margin:0 0 4px;font-size:16px}
.agline{padding:8px 0;border-top:1px dashed var(--line)}
.agline:first-of-type{border-top:none}
.agline b{display:block}
.agline span{font-size:13px;color:var(--sub)}
.ibody{display:none;padding:0 12px 12px;border-top:1px dashed var(--line)}
.item.open .ibody{display:block}
.row{margin-top:10px}
.row h4{margin:0 0 3px;font-size:12px;color:var(--sub);font-weight:500}
.row p{margin:0;white-space:pre-wrap}
.row.quick p{background:rgba(46,125,79,.1);padding:8px;border-radius:8px}
.row.resolve p{background:rgba(31,78,121,.09);padding:8px;border-radius:8px}
.acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.acts select{padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
button.b{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{color:var(--hi);border-color:var(--hi)}
.fab{position:fixed;right:16px;bottom:18px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:13px 18px;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.note{padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--sub);margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.sheet h3{margin:0 0 10px}
.sheet label{display:block;font-size:12px;color:var(--sub);margin:10px 0 3px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.sheet textarea{min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
.empty{text-align:center;color:var(--sub);padding:30px}
#copyArea{width:100%;min-height:300px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(5,1fr);gap:5px}.kpi b{font-size:18px}.kpi span{font-size:11px}}
</style>
</head>
<body>
<header>
  <h1>이문아이파크자이 3단지 입대의 액션리스트</h1>
  <div class="sub">입주자대표회의 협의용 · 항목을 탭하면 상세 · 읽기 전용 <span id="sync"></span></div>
</header>
<main>
  <div class="kpis" id="kpis"></div>
  <div class="tabs">
    <button class="tab on" data-v="list">항목별</button>
    <button class="tab" data-v="agenda" id="agTab">📌 다음 안건</button>
    <button class="tab" data-v="contact">연락처별</button>
    <button class="tab" data-v="owner">담당자별</button>
  </div>
  <div class="bar">
    <input id="q" placeholder="검색 (예: 조합, CCTV, 307동)">
    <select id="pf"><option value="">우선순위 전체</option><option>높음</option><option>보통</option><option>낮음</option></select>
    <select id="lf"><option value="">공문 전체</option><option value="y">공문 필요만</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div id="msg"></div>
  <div id="out"></div>
  <div class="acts" style="margin-top:20px"><button class="b" id="copyBtn">회의록용 텍스트 복사</button></div>
</main>
<button class="fab" id="addBtn">＋ 항목 추가</button>

<div class="modal" id="edit"><div class="sheet">
  <h3 id="eTitle">항목 추가</h3>
  <form id="eform">
    <label>제목 *</label><input name="title" required>
    <div class="two">
      <div><label>분류</label><select name="cat" id="catSel"></select></div>
      <div><label>우선순위</label><select name="priority"><option>높음</option><option selected>보통</option><option>낮음</option></select></div>
    </div>
    <div class="two">
      <div><label>상태</label><select name="status"><option>미착수</option><option>진행중</option><option>회신대기</option><option>완료</option><option>보류</option></select></div>
      <div><label>기한</label><input name="due" placeholder="예: 11/30"></div>
    </div>
    <label>연락처 (쉼표로 구분)</label><input name="contacts" placeholder="관리사무소, 조합, HDC현산">
    <div class="two">
      <div><label>담당</label><input name="owner" placeholder="예: 총무이사 / 홍길동"></div>
      <div><label>제안자</label><input name="proposer"></div>
    </div>
    <label><input type="checkbox" name="letter" style="width:auto"> 공문 발송 필요</label>
    <label><input type="checkbox" name="agenda" style="width:auto"> 📌 다음 정기회의 안건으로 추천</label>
    <label>바로 할 수 있는 것</label><textarea name="quick"></textarea>
    <label>해결하려면 (해결 조건·절차)</label><textarea name="resolve"></textarea>
    <label>배경·원문 / 진행 메모</label><textarea name="note"></textarea>
    <div class="foot">
      <button type="button" class="b danger" id="delBtn">삭제</button>
      <div style="display:flex;gap:8px"><button type="button" class="b" id="cancelBtn">취소</button><button class="b pri">저장</button></div>
    </div>
  </form>
</div></div>

<div class="modal" id="copyM"><div class="sheet">
  <h3>회의록용 텍스트</h3>
  <div class="sub" id="copyHint">아래 내용을 길게 눌러 복사하세요.</div>
  <textarea id="copyArea" readonly></textarea>
  <div class="foot"><span></span><button class="b" id="copyClose">닫기</button></div>
</div></div>

<script>
const CATS=["입대의 운영·계약","용역관리(청소·경비)","커뮤니티센터","주차·출입","보안시설(CCTV·도어)","조경·외부공간","하자·누수","대외 민원·협의"];
const STATUS=["미착수","진행중","회신대기","완료","보류"];
const PR={"높음":0,"보통":1,"낮음":2};
let items=[],db=null,canWrite=true,view="list",catF="",stF="",editingId=null,delArm=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arr=v=>Array.isArray(v)?v:String(v||"").split(",").map(x=>x.trim()).filter(Boolean);

$("#catSel").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");

function filtered(){
  const q=$("#q").value.trim().toLowerCase(),pf=$("#pf").value,lf=$("#lf").value;
  return items.filter(it=>{
    if(catF&&it.cat!==catF)return false;
    if(stF&&it.status!==stF)return false;
    if(pf&&it.priority!==pf)return false;
    if(lf&&!it.letter)return false;
    if(q){const hay=[it.title,it.cat,arr(it.contacts).join(" "),it.owner,it.proposer,it.quick,it.resolve,it.note,"#"+it.no].join(" ").toLowerCase();if(!hay.includes(q))return false;}
    return true;
  }).sort((a,b)=>(a.status==="완료")-(b.status==="완료")||(PR[a.priority]??1)-(PR[b.priority]??1)||(a.no||0)-(b.no||0));
}

function kpis(){
  const n=s=>items.filter(i=>i.status===s).length;
  const defs=[["","전체",items.length],["미착수","미착수",n("미착수")],["진행중","진행중",n("진행중")],["회신대기","회신대기",n("회신대기")],["완료","완료",n("완료")]];
  $("#kpis").innerHTML=defs.map(([k,l,v])=>`<div class="kpi ${stF===k?"on":""}" data-s="${k}"><b>${v}</b><span>${l}</span></div>`).join("");
  $("#kpis").querySelectorAll(".kpi").forEach(e=>e.onclick=()=>{stF=e.dataset.s;render();});
  const cats=[...new Set([...CATS,...items.map(i=>i.cat).filter(Boolean)])];
  $("#chips").innerHTML=[`<button class="chip ${catF?"":"on"}" data-c="">전체</button>`,...cats.map(c=>`<button class="chip ${catF===c?"on":""}" data-c="${esc(c)}">${esc(c)} ${items.filter(i=>i.cat===c&&i.status!=="완료").length}</button>`)].join("");
  $("#chips").querySelectorAll(".chip").forEach(e=>e.onclick=()=>{catF=e.dataset.c;render();});
}

function card(it){
  const cs=arr(it.contacts);
  return `<div class="item p-${esc(it.priority)} s-${esc(it.status)}" data-id="${esc(it._id)}">
  <div class="ihead"><div class="ititle"><span class="no">#${esc(it.no)}</span><span>${esc(it.title)}</span></div>
  <div class="meta"><span class="tag st st-${esc(it.status)}">${esc(it.status)}</span><span class="tag">${esc(it.priority)}</span>
  ${it.owner?`<span class="tag">👤 ${esc(it.owner)}</span>`:""}${cs.length?`<span class="tag">📞 ${esc(cs.join(", "))}</span>`:""}
  ${it.agenda&&it.status!=="완료"?`<span class="tag agtag">📌 다음 안건</span>`:""}${it.letter?`<span class="tag letter">공문</span>`:""}${it.due?`<span class="tag">⏰ ${esc(it.due)}</span>`:""}</div></div>
  <div class="ibody">
   <div class="row"><h4>분류 · 제안</h4><p>${esc(it.cat)}${it.proposer?" · 제안: "+esc(it.proposer):""}</p></div>
   ${it.quick?`<div class="row quick"><h4>✅ 바로 할 수 있는 것</h4><p>${esc(it.quick)}</p></div>`:""}
   ${it.resolve?`<div class="row resolve"><h4>🔧 해결하려면</h4><p>${esc(it.resolve)}</p></div>`:""}
   ${it.note?`<div class="row"><h4>배경·메모</h4><p>${esc(it.note)}</p></div>`:""}
   ${canWrite?`<div class="acts"><select class="stSel">${STATUS.map(s=>`<option ${s===it.status?"selected":""}>${s}</option>`).join("")}</select><button class="b editBtn">편집</button></div>`:""}
  </div></div>`;
}

function render(){
  kpis();
  const list=filtered(),out=$("#out");
  if(!items.length){out.innerHTML=`<div class="empty">아직 항목이 없습니다.</div>`;return;}
  if(!list.length){out.innerHTML=`<div class="empty">조건에 맞는 항목이 없습니다.</div>`;return;}
  const agN=items.filter(i=>i.agenda&&i.status!=="완료").length;
  $("#agTab").textContent=`📌 다음 안건 ${agN}`;
  let groups=[],head="";
  if(view==="agenda"){
    const ag=list.filter(i=>i.agenda&&i.status!=="완료");
    if(!ag.length){out.innerHTML=`<div class="empty">추천된 안건이 없습니다. 항목 편집에서 '다음 정기회의 안건으로 추천'을 체크하세요.</div>`;return;}
    head=`<div class="agbox"><h3>📌 다음 정기회의 안건 추천 (${ag.length}건)</h3><div class="sub">입대의 의결·결정이 필요한 항목입니다. 회의 후 처리된 항목은 체크를 해제하거나 상태를 바꿔주세요.</div>${ag.map((i,n)=>`<div class="agline"><b>${n+1}. ${esc(i.title)} <small style="color:var(--sub)">#${esc(i.no)}</small></b><span>결정할 것: ${esc(i.resolve||"-")}</span></div>`).join("")}</div>`;
    const m={};ag.forEach(i=>(m[i.cat||"기타"]??=[]).push(i));
    groups=[...CATS,...Object.keys(m).filter(k=>!CATS.includes(k))].filter(k=>m[k]).map(k=>[k,m[k]]);
  }else if(view==="list"){
    const m={};list.forEach(i=>(m[i.cat||"기타"]??=[]).push(i));
    groups=[...CATS,...Object.keys(m).filter(k=>!CATS.includes(k))].filter(k=>m[k]).map(k=>[k,m[k]]);
  }else{
    const m={};
    list.forEach(i=>{const keys=view==="contact"?arr(i.contacts):arr((i.owner||"미지정").replace(/\//g,","));(keys.length?keys:["미지정"]).forEach(k=>(m[k]??=[]).push(i));});
    groups=Object.entries(m).sort((a,b)=>b[1].length-a[1].length);
  }
  out.innerHTML=head+groups.map(([k,v])=>`<div class="group-h">${view==="contact"?"📞 ":view==="owner"?"👤 ":""}${esc(k)} <small>${v.filter(i=>i.status!=="완료").length}건 진행 필요</small></div>${v.map(card).join("")}`).join("");
  out.querySelectorAll(".item").forEach(el=>{
    const id=el.dataset.id;
    el.querySelector(".ihead").onclick=()=>el.classList.toggle("open");
    const s=el.querySelector(".stSel");if(s)s.onchange=()=>saveField(id,{status:s.value});
    const e=el.querySelector(".editBtn");if(e)e.onclick=()=>openEdit(id);
  });
}

async function saveField(id,patch){
  if(!db)return;
  try{await db.doc("items/"+id).update({...patch,updatedAt:new Date().toISOString()});}
  catch(e){flash("저장하지 못했습니다: "+(e.code||e.message));if(e.code==="invalid_argument"){canWrite=false;render();}}
}

function flash(t){$("#msg").innerHTML=t?`<div class="note">${esc(t)}</div>`:"";}

function openEdit(id){
  editingId=id;delArm=false;$("#delBtn").textContent="삭제";
  const f=$("#eform"),it=id?items.find(i=>i._id===id):{cat:catF||CATS[0],priority:"보통",status:"미착수"};
  $("#eTitle").textContent=id?`#${it.no} 편집`:"항목 추가";
  $("#delBtn").style.visibility=id?"visible":"hidden";
  ["title","cat","priority","status","due","owner","proposer","quick","resolve","note"].forEach(k=>f[k].value=it[k]||"");
  if(it.cat&&!CATS.includes(it.cat))f.cat.insertAdjacentHTML("beforeend",`<option>${esc(it.cat)}</option>`),f.cat.value=it.cat;
  f.contacts.value=arr(it.contacts).join(", ");
  f.letter.checked=!!it.letter;f.agenda.checked=!!it.agenda;
  $("#edit").classList.add("on");
}
$("#cancelBtn").onclick=()=>$("#edit").classList.remove("on");
$("#addBtn").onclick=()=>openEdit(null);
$("#eform").onsubmit=async ev=>{
  ev.preventDefault();if(!db){flash("데이터 연결 전입니다. 잠시 후 다시 시도하세요.");return;}
  const f=ev.target;
  const data={title:f.title.value.trim(),cat:f.cat.value,priority:f.priority.value,status:f.status.value,due:f.due.value.trim(),
    contacts:arr(f.contacts.value),owner:f.owner.value.trim(),proposer:f.proposer.value.trim(),letter:f.letter.checked,agenda:f.agenda.checked,
    quick:f.quick.value.trim(),resolve:f.resolve.value.trim(),note:f.note.value.trim(),updatedAt:new Date().toISOString()};
  try{
    if(editingId){await db.doc("items/"+editingId).update(data);}
    else{data.no=Math.max(0,...items.map(i=>+i.no||0))+1;data.createdAt=data.updatedAt;await db.collection("items").doc().set(data);}
    $("#edit").classList.remove("on");flash("");
  }catch(e){flash(e.code==="quota_exceeded"?"저장 공간이 가득 찼습니다.":"저장하지 못했습니다 ("+(e.code||e.message)+"). 편집 권한이 있는지 확인하세요.");}
};
$("#delBtn").onclick=async()=>{
  if(!delArm){delArm=true;$("#delBtn").textContent="한 번 더 누르면 삭제";return;}
  try{await db.doc("items/"+editingId).delete();$("#edit").classList.remove("on");}catch(e){flash("삭제하지 못했습니다.");}
};

$("#copyBtn").onclick=async()=>{
  const list=filtered();const m={};list.forEach(i=>(m[i.cat||"기타"]??=[]).push(i));
  const d=new Date();
  if(view==="agenda"){
    const ag=list.filter(i=>i.agenda&&i.status!=="완료");
    let t=`[다음 정기회의 안건 추천] ${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} 기준\n`;
    ag.forEach((i,n)=>{t+=`\n${n+1}. ${i.title}\n - 결정할 것: ${(i.resolve||"-").replace(/\n/g," ")}\n - 담당: ${i.owner||"미정"} / 제안: ${i.proposer||"-"}\n`;});
    $("#copyArea").value=t;
